<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Macro Security Mando</title>

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sala de mando nocturna: la ciudad vista desde arriba con luces de calle; mapa vivo a la izquierda, acciones a la derecha, cinta en vivo abajo */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel2:#F5F7FA; --raise:#FFFFFF; --line:#E2E7EE; --line2:#D2D9E3;
  --fg:#17212E; --muted:#5B6879; --dim:#8994A3;
  --accent:#0E9384; --accent-ink:#FFFFFF;
  --crit:#E0364C; --alta:#EE6A2F; --media:#E9A21F; --baja:#3B78E7; --ok:#1C9E69; --serv:#7E62D9;
  --shadow:0 1px 2px rgba(23,33,46,.06),0 6px 20px rgba(23,33,46,.07);
  --wa-bg:#ECE6DD; --wa-top:#0B5D44; --wa-in:#FFFFFF; --wa-out:#D3F2D8; --wa-ink:#17202A; --wa-muted:#5B6672; --wa-btn:#0B6A4E;
  --f-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@media (min-width:600px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.app{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px 20px;min-height:100%}
/* barra superior */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-num);font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{background:none;border:0;border-radius:999px;padding:0 14px;min-height:36px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:block}
.pill.live i{background:var(--ok);animation:live 2s infinite}
.pill.local i{background:var(--media)}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(28,158,105,.5)}70%{box-shadow:0 0 0 8px rgba(28,158,105,0)}100%{box-shadow:0 0 0 0 rgba(28,158,105,0)}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;min-height:36px}
.switch button{width:38px;height:22px;border-radius:999px;border:0;background:var(--line2);position:relative;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.switch button[aria-checked="true"]{background:var(--accent)}
.switch button[aria-checked="true"]::after{left:19px;background:#fff}
.clock{font-family:var(--f-num);font-size:20px;font-weight:600;letter-spacing:.04em}
/* vistas */
.view{display:none;min-width:0}
body[data-tab="mando"] #v-mando,body[data-tab="pron"] #v-pron,body[data-tab="anal"] #v-anal,body[data-tab="unid"] #v-unid,body[data-tab="conf"] #v-conf{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
/* mando */
@media (min-width:1280px){.top{flex-wrap:nowrap}.top .brand span{display:none}}
@media (min-width:1500px){.top .brand span{display:inline}}
.mapctl{position:absolute;right:14px;bottom:64px;display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--fg);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(23,33,46,.12)}
.mapctl #z3d{font-size:12px}
.mapctl button[aria-pressed="true"]#zZone{background:var(--accent);color:#fff;border-color:var(--accent)}
.laymenu{position:absolute;right:48px;bottom:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 10px 30px rgba(23,33,46,.18);display:flex;flex-direction:column;gap:2px;min-width:190px}
.basesel{display:flex;flex-direction:column;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.basesel .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.basesel .seg button{min-width:0;padding:0 8px;font-size:12.5px;min-height:34px}
.basesel .seg button+button{border-left:1px solid var(--line2)}
.lay{display:flex;align-items:center;gap:9px;font-size:13px;min-height:34px;cursor:pointer}
.lay input{width:17px;height:17px;accent-color:var(--accent)}
.mapwrap.zonemode canvas{cursor:crosshair}
#zoneHost{position:absolute;left:14px;bottom:62px;z-index:5;width:min(340px,calc(100% - 80px))}
.zcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 14px 36px rgba(23,33,46,.2);display:flex;flex-direction:column;gap:8px;animation:pop .2s ease-out}
.zgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.zgrid div{background:var(--panel2);border-radius:9px;padding:6px 8px}
.zgrid b{display:block;font-family:var(--f-num);font-size:24px;line-height:1}
.zgrid span{font-size:11px;color:var(--muted)}
.zrow{font-size:12.5px;color:#3C4858}
.zrow b{color:var(--fg)}
.mapwrap.zoneopen .legend{display:none}
.mapwrap.alerting::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;box-shadow:inset 0 0 0 4px #E0364C,inset 0 0 60px rgba(224,54,76,.35);animation:alertpulse 1.1s ease-in-out infinite;z-index:4}
.counters,.layers{transition:opacity .3s}
.mapwrap.alerting .counters,.mapwrap.alerting .layers{opacity:0;pointer-events:none}
@keyframes alertpulse{50%{box-shadow:inset 0 0 0 2px rgba(224,54,76,.5),inset 0 0 20px rgba(224,54,76,.12)}}
#alertHost{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;width:min(440px,calc(100% - 28px))}
.alertcard{background:#fff;border:2px solid #E0364C;border-radius:16px;padding:14px 16px;box-shadow:0 20px 50px rgba(224,54,76,.28);display:flex;flex-direction:column;gap:8px;animation:drop .45s cubic-bezier(.2,.9,.25,1.2)}
@keyframes drop{from{transform:translateY(-30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){#alertHost{top:auto;bottom:62px}}
@media (min-width:1020px){body[data-tab="mando"] .app{height:100vh}body[data-tab="mando"] #v-mando{flex:1;min-height:0}.mando{height:100%}.mapwrap{height:100%!important;max-height:none!important;min-height:480px}.side{height:100%!important;max-height:none!important}}
.mando{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1020px){.mando{grid-template-columns:minmax(0,1fr) 360px}}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#E7EBF0;box-shadow:var(--shadow);height:calc(100vh - 92px);min-height:520px;max-height:980px}
@media (max-width:1019px){.mapwrap{height:62vh;min-height:420px}}
.mapwrap #map{position:absolute;inset:0}
.mapwrap.zonemode #map .maplibregl-canvas{cursor:crosshair}
.mk{--c:#E0364C;position:absolute;top:0;left:0;width:34px;height:46px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .pin{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 4px 10px rgba(23,33,46,.35);display:flex;align-items:center;justify-content:center;z-index:2;position:relative}
.mk .pin img{width:22px;height:22px;display:block}
.mk .stem{width:3px;height:12px;background:var(--c);border-radius:2px;margin-top:-2px}
.mk .pulse{position:absolute;bottom:-4px;left:50%;width:14px;height:6px;margin-left:-7px;border-radius:50%;background:rgba(23,33,46,.25)}
.mk.new .pulse::after{content:"";position:absolute;inset:-2px;border:3px solid var(--c);border-radius:50%;animation:mkp 1.6s ease-out infinite}
@keyframes mkp{from{transform:scale(1);opacity:.9}to{transform:scale(6);opacity:0}}
.mk.big{width:46px;height:58px}.mk.big .pin{width:42px;height:42px}.mk.big .pin img{width:32px;height:32px}
.mk.big .pulse::after{content:"";position:absolute;inset:-2px;border:3px solid var(--c);border-radius:50%;animation:mkp 1.2s ease-out infinite}
.mk.sel .pin{outline:3px solid #17212E;outline-offset:2px}
.cl{--c:#E0364C;width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 5px rgba(255,255,255,.55),0 6px 14px rgba(23,33,46,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-num);font-size:20px;font-weight:700;cursor:pointer}
.cl.new{animation:clp 1.8s ease-in-out infinite}
@keyframes clp{50%{box-shadow:0 0 0 11px rgba(255,255,255,.35),0 6px 14px rgba(23,33,46,.3)}}
.ulab{display:flex;align-items:center;gap:6px;background:#1B2431;color:#fff;border-radius:999px;padding:3px 10px 3px 8px;font-family:var(--f-mono);font-size:11px;font-weight:600;box-shadow:0 4px 10px rgba(23,33,46,.35);cursor:pointer;white-space:nowrap}
.ulab i{width:7px;height:7px;border-radius:50%;background:#fff}
.ulab.busy{background:#F0A21C;color:#2B1D00}.ulab.busy i{background:#2B1D00}
.ulab.flash{animation:ufl .9s ease-in-out infinite}
@keyframes ufl{50%{box-shadow:0 0 0 9px rgba(28,158,105,.4)}}
.slab{display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.slab b{font-family:var(--f-num);font-size:20px;font-weight:700;color:#24303F;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 8px #fff;letter-spacing:.04em}
.slab span{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:#fff;color:#4A5768;border:1px solid #C9D2DD;white-space:nowrap}
.slab.lv-alto span{background:#E0364C;color:#fff;border-color:#E0364C}.slab.lv-medio span{background:#F0A21C;color:#2B1D00;border-color:#F0A21C}
.zs{display:flex;align-items:center;gap:7px;cursor:pointer}
.zs i{width:14px;height:14px;background:#1C9E69;border:2px solid #fff;transform:rotate(45deg);box-shadow:0 2px 6px rgba(23,33,46,.3)}
.zs span{font-size:11.5px;font-weight:700;color:#137A52;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;white-space:nowrap}
.vlab{background:#0E9384;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 8px rgba(23,33,46,.25)}
.vlab.draft{background:#fff;color:#0E9384;border:1.5px solid #0E9384}
.maplibregl-ctrl-attrib{font-size:10px}
.mapwrap.sat .slab b{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6)}
.mapwrap.sat .slab span{box-shadow:0 2px 8px rgba(0,0,0,.4)}
.mapwrap.sat .zs span{color:#B8F5D6;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.mapwrap.sat .legend{background:rgba(255,255,255,.92)}
.mapwrap.sat{background:#0B111A}
.mapmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:420px;box-shadow:0 14px 36px rgba(23,33,46,.18);display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.mapmsg b{color:var(--fg);font-size:15px}
.places{display:flex;flex-direction:column;gap:6px}
.place{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.place:hover{border-color:var(--accent)}
.place b{font-size:13.5px}.place span{font-size:12px;color:var(--muted)}
.counters{position:absolute;top:14px;left:14px;right:70px;display:flex;gap:10px;flex-wrap:wrap;z-index:3}
.kp{--st:#17212E;--tint:#FFFFFF;background:linear-gradient(160deg,var(--tint),#FFFFFF 70%);border:1px solid var(--line);border-radius:16px;padding:11px 14px 12px;width:214px;text-align:left;display:flex;flex-direction:column;gap:5px;box-shadow:0 10px 28px rgba(23,33,46,.14),0 1px 0 rgba(255,255,255,.8) inset;color:var(--fg);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.kp::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--st)}
.kp:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(23,33,46,.2)}
.kp.lv-ok{--st:#1C9E69;--tint:#EAF7F0}.kp.lv-warn{--st:#D9901A;--tint:#FFF5E0}.kp.lv-bad{--st:#E0364C;--tint:#FDE8EB}.kp.lv-idle{--st:#2F6FDE;--tint:#EEF3FD}
.kp.lv-bad{animation:kpwarn 1.6s ease-in-out infinite}
@keyframes kpwarn{50%{box-shadow:0 10px 28px rgba(224,54,76,.35),0 0 0 3px rgba(224,54,76,.25)}}
.kp.bump .kv{animation:bump .5s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
.kl{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--st)}
.kmain{display:flex;align-items:center;gap:10px;min-height:52px}
.kv{font-family:var(--f-num);font-size:50px;font-weight:700;line-height:.95;color:var(--fg);display:inline-block;transform-origin:left center}
.kv.sm{font-size:30px}
.ktag{font-size:11px;font-weight:800;color:#fff;background:var(--st);padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.kof{font-size:13px;color:var(--muted);font-weight:600}
.kcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.ring svg{color:var(--fg);flex:none}
.spk{flex:1;min-width:0;height:34px}
.ks{font-size:12px;color:var(--muted);line-height:1.3}
.ks b{color:var(--fg)}
.cars{display:flex;gap:3px;flex-wrap:wrap}
.car{display:inline-flex;width:24px;height:20px;align-items:center;justify-content:center;border-radius:6px}
.car.free{color:#1C9E69;background:#E3F5EB}.car.busy{color:#B57712;background:#FCEFD0}
.ctr{border-radius:12px;padding:9px 16px 9px;min-width:118px;color:#fff;box-shadow:0 6px 18px rgba(23,33,46,.18)}
.ctr b{display:block;font-family:var(--f-num);font-size:42px;font-weight:700;line-height:1}
.ctr span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.92}
.ctr[data-k="sin"]{background:#E0364C}.ctr[data-k="en"]{background:#F0A21C;color:#2B1D00}.ctr[data-k="ll"]{background:#2F6FDE}
.ctr[data-k="sin"].calm{background:#1C9E69}
.layers{position:absolute;top:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.layers button{background:#fff;border:1px solid var(--line2);color:var(--muted);border-radius:999px;min-height:32px;padding:0 12px;font-size:12px;font-weight:600;box-shadow:0 2px 6px rgba(23,33,46,.08)}
.layers button[aria-pressed="true"]{color:#fff;background:var(--fg);border-color:var(--fg)}
.legend{position:absolute;left:14px;bottom:62px;display:flex;flex-wrap:wrap;gap:12px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);pointer-events:none;box-shadow:0 2px 8px rgba(23,33,46,.08)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.ticker{position:absolute;left:0;right:0;bottom:0;height:50px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;overflow:hidden}
.ticker .lbl{font-family:var(--f-num);font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--crit);flex:none;display:flex;align-items:center;gap:6px}
.ticker .lbl i{width:8px;height:8px;border-radius:50%;background:var(--crit);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tk{display:flex;gap:8px;overflow:hidden;flex:1;min-width:0}
.tk button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:30px;font-size:12.5px;color:var(--fg);display:flex;align-items:center;gap:7px;white-space:nowrap;animation:slidein .5s ease-out}
.tk button .t{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
@keyframes slidein{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}
.pop{position:absolute;z-index:5;width:290px;max-width:calc(100% - 24px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 18px 40px rgba(23,33,46,.22);display:flex;flex-direction:column;gap:8px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.pop .x{position:absolute;top:6px;right:6px}
/* panel derecho */
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:1020px){.side{height:calc(100vh - 92px);min-height:520px;max-height:980px}}
.sec{display:flex;flex-direction:column;min-height:0}
.sec.grow{flex:1}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;gap:8px}
.sechead h2{margin:0;font-size:15px;font-weight:700}
.sechead span{font-size:12px;color:var(--muted)}
.cards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:0 10px 10px}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(23,33,46,.05);border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:7px;animation:cardin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.card.sos{background:#FFF3F4;border-color:#F3B5BE;box-shadow:0 8px 24px rgba(224,54,76,.14)}
.card.sel{border-color:var(--fg)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .tt{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.card .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tm{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--muted);flex:none}
.card .tm.late{color:var(--crit)}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EEF1F5;color:#4A5768;white-space:nowrap}
.chip.red{background:var(--crit);color:#fff}
.chip.c5{color:#0B7368;background:#DDF3F0}
.go{border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:8px}
.go.red{background:var(--crit);color:#fff}
.go:disabled{background:var(--line2);color:var(--dim);cursor:not-allowed}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

function localApi(){
  let docs=new Map();try{const raw=localStorage.getItem('ms3.db');if(raw)docs=new Map(JSON.parse(raw));}catch(e){}
  let stT=null;const save=()=>{clearTimeout(stT);stT=setTimeout(()=>{try{localStorage.setItem('ms3.db',JSON.stringify([...docs]));}catch(e){}},600);};
  const subs=[];
  const col=p=>p.slice(0,p.lastIndexOf('/'));
  const snap=c=>{const out=[];for(const [p,d] of docs){if(col(p)===c)out.push({id:p.slice(p.lastIndexOf('/')+1),data:d});}return out;};
  const notify=c=>{save();for(const sb of subs)if(sb.c===c)sb.cb(snap(c));};
  return {
    set:async(p,d)=>{docs.set(p,JSON.parse(JSON.stringify(d)));notify(col(p));},
    update:async(p,d)=>{const cur=docs.get(p);if(!cur)return;docs.set(p,Object.assign({},cur,JSON.parse(JSON.stringify(d))));notify(col(p));},
    del:async p=>{docs.delete(p);notify(col(p));},
    get:async p=>docs.has(p)?docs.get(p):null,
    watch:(c,cb)=>{subs.push({c,cb});cb(snap(c));},
    lease:async()=>true
  };
}

/* ===== geometría y turnos ===== */
function inPoly(x,y,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p[0];y+=p[1];}return {x:x/poly.length,y:y/poly.length};}
function sectorAt(x,y){for(const sc of S.config.sectores)if(inPoly(x,y,sc.poly))return sc.id;let best=null,bd=1e9;for(const sc of S.config.sectores){const c=centroid(sc.poly);const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;best=sc.id;}}return best;}
function randIn(poly){const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);for(let i=0;i<200;i++){const x=rnd(Math.min(...xs)+1.5,Math.max(...xs)-1.5),y=rnd(Math.min(...ys)+1.5,Math.max(...ys)-1.5);if(inPoly(x,y,poly))return {x,y};}return centroid(poly);}

const dayNum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
function slotOf(ms){const t=T();const d=new Date(ms);const hh=d.getHours();let dn=dayNum(d);if(hh<t[0].inicio)dn--;return dn*t.length+turnoIdx(hh);}

/* ===== histórico simulado ===== */
function genHistorial(dias){
  const t=T(),cfg=S.config,out=[];const prev={};
  const tm=t.map((x,i)=>{const mid=(x.inicio+((t[(i+1)%t.length].inicio-x.inicio+24)%24)/2)%24;return (mid>=21||mid<6)?1.3:(mid>=13?1.1:.75);});
  const items=cfg.catalogo;const today=new Date();today.setHours(0,0,0,0);
  const prox={},alertas={horario:0,noid:0,qr:0};
  cfg.sectores.forEach((sc,si)=>{prox[sc.id]=Math.round((SECTOR_RATE[si]||.08)*dias*3+rnd(0,8));});
  alertas.horario=Math.round(dias/22);alertas.noid=Math.round(dias/30);alertas.qr=Math.round(dias/45);
  for(let d=dias;d>=1;d--){
    const day=new Date(today.getTime()-d*864e5);const dw=day.getDay();const wk=dw===5||dw===6?1.35:(dw===0?1.15:1);
    t.forEach((tu,ti)=>{cfg.sectores.forEach((sc,si)=>{
      let p=(SECTOR_RATE[si]!=null?SECTOR_RATE[si]:.08)*tm[ti]*wk*(prev[sc.id]?2.3:1);p=Math.min(.9,p);
      const has=Math.random()<p;prev[sc.id]=has;if(!has)return;
      const n=1+(Math.random()<.3?1:0);const wmap=TYPE_W[si]||TYPE_W.def;const w=items.map(c=>wmap[c.id]!=null?wmap[c.id]:(c.grupo==='servicio'?.5:.4));
      for(let k=0;k<n;k++){const dur=(t[(ti+1)%t.length].inicio-tu.inicio+24)%24||24;let hh=Math.floor(tu.inicio+Math.random()*dur);let dd=d;if(hh>=24){hh-=24;dd=d-1;}
        const c=wpick(items,w);const att=Math.random()<(ATT_P[c.id]||ATT_P.def)?1:0;const arr=Math.round(clamp(4+si*1.2+rnd(-2,6),2,25));
        const pp=randIn(sc.poly);out.push([dd,hh,Math.floor(Math.random()*60),sc.id,c.id,att,arr,+pp.x.toFixed(2),+pp.y.toFixed(2)]);}
    });});
  }
  return {entries:out,prox,alertas,dias};
}
function histMs(e){const today=new Date();today.setHours(0,0,0,0);return today.getTime()-e[0]*864e5+e[1]*36e5+e[2]*6e4;}

/* ===== modelo: Markov entre turnos + día + tipo ===== */
function series(){
  const nT=T().length;const sets={},types={},counts={};
  for(const sc of S.config.sectores){sets[sc.id]=new Set();types[sc.id]=Array.from({length:nT},()=>({}));counts[sc.id]=0;}
  let minS=Infinity,maxHist=-Infinity;
  const add=(ms,sid,cid,isHist)=>{if(!sets[sid])return;if(cat(cid).grupo!=='delito')return;const sl=slotOf(ms);sets[sid].add(sl);const j=mod(sl,nT);types[sid][j][cid]=(types[sid][j][cid]||0)+1;counts[sid]++;if(sl<minS)minS=sl;if(isHist&&sl>maxHist)maxHist=sl;};
  const H=(S.historial&&S.historial.entries)||[];
  for(const e of H)add(histMs(e),e[3],e[4],true);
  const cur=slotOf(Date.now());const stale=maxHist>-Infinity&&(cur-maxHist)>14*nT;
  for(const ev of S.eventos.values()){if(ev.estado==='descartado'||cat(ev.cid).grupo!=='delito')continue;if(stale){if(sets[ev.sector])sets[ev.sector].add(slotOf(ev.creado));continue;}add(ev.creado,ev.sector,ev.cid,false);}
  const end=stale?maxHist:cur-1;if(minS===Infinity)minS=end-1;minS=Math.max(minS,end-6000);
  return {sets,types,counts,from:minS,end,cur,stale,nT};
}
function fit(sr,from,to){
  const nT=sr.nT;const P={},B={},C={};const dEv=Array.from({length:7},()=>Array(nT).fill(0)),dSl=Array.from({length:7},()=>Array(nT).fill(0));
  for(const sid in sr.sets){const set=sr.sets[sid];const c=Array.from({length:nT},()=>[[0,0],[0,0]]);const b=Array.from({length:nT},()=>[0,0]);
    for(let k=from+1;k<=to;k++){const j=mod(k,nT);const a=set.has(k-1)?1:0,y=set.has(k)?1:0;c[j][a][y]++;b[j][0]+=y;b[j][1]++;const dw=dowOfSlot(k);dEv[dw][j]+=y;dSl[dw][j]++;}
    C[sid]=c;P[sid]=c.map(m=>[(m[0][1]+1)/(m[0][0]+m[0][1]+2),(m[1][1]+1)/(m[1][0]+m[1][1]+2)]);B[sid]=b.map(x=>(x[0]+1)/(x[1]+2));}
  const F=Array.from({length:7},()=>Array(nT).fill(1));
  for(let j=0;j<nT;j++){let e=0,sl=0;for(let d=0;d<7;d++){e+=dEv[d][j];sl+=dSl[d][j];}const r=(e+1)/(sl+2);for(let d=0;d<7;d++)F[d][j]=clamp(((dEv[d][j]+1)/(dSl[d][j]+2))/r,.5,2);}
  return {P,B,F,C};
}
const qf=(m,sid,j,a,dw)=>Math.min(.97,m.P[sid][j][a]*m.F[dw][j]);
function model(){
  const sr=series();const m=fit(sr,sr.from,sr.end);const nT=sr.nT;const out={};
  for(const sc of S.config.sectores){const sid=sc.id;const set=sr.sets[sid];const a0=set.has(sr.cur)?1:0;let pi=[1-a0,a0];const fc=[];
    for(let k=1;k<=3;k++){const sl=sr.cur+k;const j=mod(sl,nT);const dw=dowOfSlot(sl);const pe=pi[0]*qf(m,sid,j,0,dw)+pi[1]*qf(m,sid,j,1,dw);fc.push({slot:sl,p:pe,j,dw});pi=[1-pe,pe];}
    const n=sr.counts[sid];
    const tipos=fc.map(f=>{const tc=sr.types[sid][f.j];const crimes=S.config.catalogo.filter(c=>c.grupo==='delito');const tot=crimes.reduce((a,c)=>a+(tc[c.id]||0),0);return crimes.map(c=>({c,p:((tc[c.id]||0)+.5)/(tot+.5*crimes.length)})).sort((a,b)=>b.p-a.p).slice(0,2);});
    out[sid]={fc,cur:a0,tipos,n,conf:n>=150?'Alta':(n>=50?'Media':'Baja')};}
  let bt=null;const cut=sr.end-21*nT;
  if(cut-sr.from>=14*nT){const mt=fit(sr,sr.from,cut);let bm=0,bb=0,n=0;for(const sid in sr.sets){const set=sr.sets[sid];for(let k=cut+1;k<=sr.end;k++){const j=mod(k,nT);const a=set.has(k-1)?1:0,y=set.has(k)?1:0;bm+=(qf(mt,sid,j,a,dowOfSlot(k))-y)**2;bb+=(mt.B[sid][j]-y)**2;n++;}}bt={brierM:bm/n,brierB:bb/n,mejora:1-(bm/n)/(bb/n),n};}
  return {sr,m,out,bt};
}
let MODEL=null,modelAt=0;
function getModel(force){if(force||!MODEL||Date.now()-modelAt>20000){MODEL=model();modelAt=Date.now();}return MODEL;}
const level=p=>p>=.45?'alto':(p>=.25?'medio':'bajo');
function why(sid,md,k){
  const o=md.out[sid];const f=o.fc[k-1];const P=md.m.P[sid][f.j];const F=md.m.F[f.dw][f.j];const tn=T()[f.j].nombre.toLowerCase();
  if(o.n<50)return 'Pocos casos registrados en este sector. Tómalo como referencia, no como certeza.';
  if(k===1&&o.cur&&P[1]>P[0]*1.5)return 'Ya hubo un delito en este turno. Cuando eso pasa aquí, el riesgo del siguiente sube de '+pct(P[0])+' a '+pct(P[1])+'.';
  if(F>=1.2)return 'Los '+DOW[f.dw]+' en la '+tn+' suelen tener más delitos de lo normal.';
  if(F<=.85)return 'Los '+DOW[f.dw]+' en la '+tn+' suelen ser más tranquilos.';
  return (k===1&&!o.cur?'Sin delitos en este turno. ':'')+'Riesgo habitual para este horario.';
}

/* ===== repetición cercana ===== */
function cercana(){const R=5;const now=Date.now();const ev=[...S.eventos.values()].filter(e=>cat(e.cid).grupo==='delito'&&e.estado!=='descartado'&&now-e.creado<60*60e3);const zones=[];
  for(const e of ev){const nb=ev.filter(o=>dist(o,e)<=R);if(nb.length>=3){const cx=nb.reduce((a,o)=>a+o.x,0)/nb.length,cy=nb.reduce((a,o)=>a+o.y,0)/nb.length;if(!zones.some(z=>Math.hypot(z.x-cx,z.y-cy)<R))zones.push({x:cx,y:cy,n:nb.length});}}return zones;}

async function crearEvento(o){
  const c=cat(o.cid);const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const pre=o.sos?'E':(c.grupo==='oficial'?'Q':(o.origen==='Oficial'?'P':'R'));
  const ev={id,folio:folio(pre),cid:o.cid,cat:c.nombre,sub:o.sub||'',prioridad:c.prioridad,sector:sectorAt(o.x,o.y),x:+o.x.toFixed(2),y:+o.y.toFixed(2),origen:o.origen||'WhatsApp',estado:o.estado||'nuevo',unidad:o.unidad||null,creado:Date.now(),nota:o.nota||'',sos:!!o.sos,chatId:o.chatId||null,ruta:o.sos?[[+o.x.toFixed(2),+o.y.toFixed(2)]]:null,tracking:!!o.sos,c5:null,foto:false,origenUnidad:o.origenUnidad||null};

  await write(()=>api.set('eventos/'+id,ev));return ev;
}

function histCounts(){const H=S.historial&&S.historial.entries;if(!H||H.length<30)return null;const c={};for(const e of H){c[e[3]]=c[e[3]]||{n:0,t:{}};c[e[3]].n++;c[e[3]].t[e[4]]=(c[e[3]].t[e[4]]||0)+1;}return c;}

function typeWeights(sid){const hc=histCounts();const si=S.config.sectores.findIndex(x=>x.id===sid);const wmap=TYPE_W[si]||TYPE_W.def;return S.config.catalogo.map(x=>hc&&hc[sid]?((hc[sid].t[x.id]||0)+(x.grupo==='servicio'?1:.3)):(wmap[x.id]!=null?wmap[x.id]:.4));}

async function clearEvents(){for(const id of [...S.eventos.keys()])write(()=>api.del('eventos/'+id));for(const u of S.unidades.values())if(u.estado!=='disponible')write(()=>api.update('unidades/'+u.id,{estado:'disponible',evento:null}));toast('Eventos borrados');}
async function resetAll(){await clearEvents();for(const u of [...S.unidades.keys()])await write(()=>api.del('unidades/'+u));await seedAll(defaultConfig());cfg=null;renderConf();toast('Restablecido al ejemplo');}
function loadCSV(file){const r=new FileReader();r.onload=async()=>{
  const lines=String(r.result).split(/\r?\n/).filter(x=>x.trim());if(lines.length<2){toast('El archivo está vacío.');return;}
  const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const hd=lines[0].split(sep).map(norm);const ix=k2=>hd.findIndex(x=>x===k2||x.startsWith(k2));
  const iF=ix('fecha'),iH=ix('hora'),iS=ix('sector'),iE=ix('evento')>=0?ix('evento'):ix('tipo');if(iF<0||iH<0||iS<0||iE<0){toast('Faltan columnas: FECHA, HORA, SECTOR, EVENTO.');return;}
  const today=new Date();today.setHours(0,0,0,0);const out=[];let skip=0;const C=S.config;
  for(const ln of lines.slice(1)){const c=ln.split(sep);const f=(c[iF]||'').trim(),hr=(c[iH]||'').trim(),sc=norm(c[iS]),ev=norm(c[iE]);let d=null;const m1=f.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/),m2=f.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m1)d=new Date(+m1[1],+m1[2]-1,+m1[3]);else if(m2)d=new Date(+(m2[3].length===2?'20'+m2[3]:m2[3]),+m2[2]-1,+m2[1]);const hm=hr.match(/(\d{1,2}):(\d{2})/);
    let sid=null;const num=parseInt(sc,10);if(!isNaN(num)&&C.sectores[num-1])sid=C.sectores[num-1].id;else{const fnd=C.sectores.find(x=>norm(x.nombre)===sc||x.id===sc);if(fnd)sid=fnd.id;}
    const ct=C.catalogo.find(x=>norm(x.nombre)===ev)||C.catalogo.find(x=>norm(x.nombre).split(/\s+/).filter(w=>w.length>4).some(w=>ev.includes(w)));
    if(!d||!hm||!sid||!ct){skip++;continue;}out.push([Math.round((today-d)/864e5),+hm[1],+hm[2],sid,ct.id,1,8]);}
  if(!out.length){toast('No se pudo leer ninguna fila. Revisa que los sectores coincidan con los configurados.');return;}
  const entries=out.sort((a,b)=>a[0]-b[0]).slice(0,6000);await write(()=>api.set('historial/main',{entries,prox:{},alertas:{},dias:90,origen:'archivo',generado:Date.now()}));
  toast(entries.length+' eventos cargados'+(skip?' · '+skip+' filas omitidas':''));renderConf();};r.readAsText(file);}

/* ===== modo demostración (uno solo lo ejecuta) ===== */
let leader=false;
async function leaseLoop(){leader=await api.lease('meta/demo',12000);}
function demoTick(){
  if(!S.config||!S.config.demo||!leader)return;const now=Date.now();
  const open=[...S.eventos.values()].filter(abierto).length;
  const pendN=[...S.eventos.values()].filter(e=>e.estado==='nuevo').length;if(Math.random()<(pendN<2?.3:(pendN<4?.1:0))&&open<10){
    const recent=[...S.eventos.values()].filter(e=>now-e.creado<30*60e3&&cat(e.cid).grupo==='delito');let p;
    if(recent.length&&Math.random()<.35){const r=pick(recent);p={x:clamp(r.x+rnd(-3.5,3.5),1,99),y:clamp(r.y+rnd(-3.5,3.5),1,69)};}else p=randomHere();
    const c=wpick(S.config.catalogo,typeWeights(sectorAt(p.x,p.y)));
    crearEvento({cid:c.id,sub:c.subtipos&&c.subtipos.length?pick(c.subtipos):'',x:p.x,y:p.y,origen:Math.random()<.65?'WhatsApp':(Math.random()<.6?'911':'Comercio')});}
  const taken=new Set();
  for(const ev of S.eventos.values()){
    if(ev.chatId)continue; // lo del emulador lo atiende la persona
    if(ev.estado==='nuevo'&&now-ev.creado>rnd(18e3,40e3)&&cat(ev.cid).grupo!=='oficial'){const u=freeUnits(ev,ev.origenUnidad).find(x=>!taken.has(x.id));if(u){assign(ev,u.id,true);taken.add(u.id);}}
    else if(ev.estado==='asignado'&&ev.unidad&&S.unidades.get(ev.unidad)){const u=S.unidades.get(ev.unidad);const d=dist(u,ev);if(d<1.5)write(()=>api.update('eventos/'+ev.id,{estado:'en_sitio',llegada:now}));else{const st=Math.min(d,2.6);write(()=>api.update('unidades/'+u.id,{x:+(u.x+(ev.x-u.x)/d*st).toFixed(2),y:+(u.y+(ev.y-u.y)/d*st).toFixed(2)}));}}
    else if(ev.estado==='en_sitio'&&ev.llegada&&now-ev.llegada>rnd(25e3,50e3)&&ev.unidad&&S.unidades.get(ev.unidad))closeEv(ev,'cerrado',{encontrada:Math.random()<.6,detenidos:Math.random()<.2,hechos:'Atendido (demostración)'});
    else if(ev.estado==='asignado'&&ev.unidad&&!S.unidades.get(ev.unidad)&&now-(ev.asignado||now)>40e3)closeEv(ev,'cerrado',{encontrada:false,detenidos:false,hechos:'Turnado a supervisión'});
  }
  const closed=[...S.eventos.values()].filter(e=>!abierto(e)).sort((a,b)=>(a.cerrado||a.creado)-(b.cerrado||b.creado));if(S.eventos.size>240)closed.slice(0,20).forEach(e=>write(()=>api.del('eventos/'+e.id)));
}

/* ===== ejemplos por cliente ===== */
let applying=false;
async function applyPreset(pr){if(applying)return;applying=true;try{
  for(const id of [...S.eventos.keys()])await write(()=>api.del('eventos/'+id));
  for(const id of [...S.unidades.keys()])await write(()=>api.del('unidades/'+id));
  await write(()=>api.set('config/main',pr.config));S.config=pr.config;
  for(const u of pr.unidades)await write(()=>api.set('unidades/'+u.id,u));
  await write(()=>api.set('historial/main',Object.assign({},pr.historial,{generado:Date.now()})));
  disp.clear();staticKey='';if(CITY)CITY.bld.forEach(b=>{b.sid=null;});cfg=null;setTimeout(()=>{flyHome();syncAll();},80);toast('Ejemplo '+pr.config.cliente+' cargado');}finally{applying=false;}}
const needsPreset=(c,pr)=>c&&!c.presetDone&&(c.preset!==pr.id||(c.presetV||1)<(pr.config.presetV||1));
async function maybePreset(){const pr=S.presets&&S.presets.get('puebla');if(!pr||!needsPreset(S.config,pr))return;if(!(await api.lease('meta/preset',30000)))return;const c=await api.get('config/main');if(!needsPreset(c,pr))return;await applyPreset(pr);}
/* ===== arranque ===== */
async function seedAll(c){
  await write(()=>api.set('config/main',c));S.config=c;
  for(const [i,sc] of c.sectores.entries()){const ce=centroid(sc.poly);const uid='P-'+pad(i+1);const of=OFIC[i%OFIC.length];await write(()=>api.set('unidades/'+uid,{id:uid,oficial:of[0],horaIni:of[1],horaFin:of[2],placa:'MS-'+(1200+i),sector:sc.id,...(()=>{let p;do{p=randIn(sc.poly);}while(Math.hypot(p.x-ce.x,p.y-ce.y)<6&&Math.random()<.95);return {x:+p.x.toFixed(2),y:+p.y.toFixed(2)};})(),estado:'disponible',evento:null}));}
  const g=genHistorial(90);await write(()=>api.set('historial/main',Object.assign(g,{origen:'simulado',generado:Date.now()})));
}
let rq=0;
function render(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;if(!S.config)return;
  $('#cliente').textContent=S.config.cliente;const ti=turnoIdx(new Date().getHours());$('#turnoNow').lastChild.textContent=T()[ti].nombre+' · '+pad(T()[ti].inicio)+':00–'+pad(T()[(ti+1)%T().length].inicio)+':00';
  $('#demoSw').setAttribute('aria-checked',String(!!S.config.demo));
  const ae=document.activeElement;const typing=ae&&ae.matches&&ae.matches('input,textarea,select');
  if(!typing||UI.tab==='mando')renderSide();renderPop();
  if(UI.tab==='unid'&&!typing)renderUnid();if(UI.tab==='anal'&&!typing)renderAnal();if(UI.tab==='pron'&&!typing&&Date.now()-(render.pron||0)>8000){render.pron=Date.now();renderPron();}
  if(ALERT.id){const ae=S.eventos.get(ALERT.id);if(!ae||!abierto(ae)){endAlert();}else{if(ae.estado!=='nuevo'&&!ALERT.closing){ALERT.closing=true;setTimeout(()=>{if(ALERT.id===ae.id)endAlert();},6000);}renderAlert();}}
  if(mapReady){syncEvents();syncUnits();if(Date.now()-(render.hh||0)>4000){render.hh=Date.now();syncHeat();syncSectorLabels();}if(Date.now()-hexT>20000){hexT=Date.now();syncHex(false);}}
  if(ZONE.vig||(ZONE.draft&&!dragZone))renderZone();
  chatUpdates();});}
function setTab(t){UI.tab=t;document.body.dataset.tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  if(t==='mando'){requestAnimationFrame(()=>{fitView($('#map'));});}
  if(t==='pron')renderPron();if(t==='anal')renderAnal();if(t==='unid')renderUnid();if(t==='conf'){cfg=null;renderConf();}
  try{history.replaceState(null,'',t==='mando'?location.pathname+location.search:'#'+t);}catch(e){}}
function renderLayers(){const B=[['calles','Calles'],['claro','Claro'],['satelite','Satélite']];const base=h('div',{class:'basesel'},h('span',{class:'muted',style:'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em'},'Fondo del mapa'),h('div',{class:'seg',role:'group','aria-label':'Fondo del mapa'},...B.map(([k3,l3])=>h('button',{'aria-pressed':String(UI.base===k3),onclick:()=>setBase(k3)},l3))));
  const L=[['columnas','Columnas 3D de delitos'],['riesgo','Riesgo por sector'],['calor','Calor de delitos'],['zonas','Zonas seguras'],['patrullas','Patrullas'],['vigiladas','Zonas vigiladas']];$('#layers').replaceChildren(base,h('span',{class:'muted',style:'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px'},'Qué mostrar'),...L.map(([k2,t2])=>h('label',{class:'lay'},(()=>{const c=h('input',{type:'checkbox',id:'ly_'+k2});c.checked=UI.layers[k2]!==false;c.addEventListener('change',()=>{UI.layers[k2]=c.checked;staticKey='';syncAll();if(k2==='columnas'&&map&&map.getLayer('hex'))map.setLayoutProperty('hex','visibility',c.checked?'visible':'none');});return c;})(),t2)));}
function wire(){
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  $('#qAll').addEventListener('click',()=>{UI.qf='all';$('#qAll').setAttribute('aria-pressed','true');$('#qUrg').setAttribute('aria-pressed','false');renderSide();});
  $('#qUrg').addEventListener('click',()=>{UI.qf='urg';$('#qUrg').setAttribute('aria-pressed','true');$('#qAll').setAttribute('aria-pressed','false');renderSide();});
  $('#demoSw').addEventListener('click',()=>{const v=!(S.config&&S.config.demo);write(()=>api.update('config/main',{demo:v}));toast(v?'Modo demostración encendido para todos':'Modo demostración apagado');});
  const openD=o=>{$('#drawer').classList.toggle('open',o);$('#fab').setAttribute('aria-expanded',String(o));if(o){renderChat();setTimeout(()=>$('#waText').focus({preventScroll:true}),300);}};
  $('#fab').addEventListener('click',()=>openD(true));$('#waClose').addEventListener('click',()=>openD(false));
  $('#waForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#waText').value;$('#waText').value='';onUserText(v);});
  $('#waReset').addEventListener('click',()=>{chat=[];lsSet('ms2.chatlog',[]);stopSOS(false);menu(true);});
  window.addEventListener('resize',()=>{if(UI.tab==='mando')fitView($('#map'));});
  $('#zIn').addEventListener('click',()=>{map&&map.zoomIn();});$('#zOut').addEventListener('click',()=>{map&&map.zoomOut();});$('#zHome').addEventListener('click',()=>{if(ALERT.id)endAlert();UI.sel=null;renderPop();flyHome();});
  $('#zZone').addEventListener('click',()=>setZoneMode(!ZONE.mode));
  $('#zLay').addEventListener('click',()=>{const m=$('#layers');m.hidden=!m.hidden;$('#zLay').setAttribute('aria-expanded',String(!m.hidden));});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ZONE.mode)setZoneMode(false);else if(ZONE.draft||ZONE.vig){ZONE.draft=null;ZONE.vig=null;renderZone();}}});
  $('#z3d').addEventListener('click',()=>{UI.flat=!UI.flat;if(map){map.easeTo({pitch:UI.flat?0:58,bearing:UI.flat?0:map.getBearing(),duration:800});if(bldLayer&&map.getLayer(bldLayer))map.setLayoutProperty(bldLayer,'visibility',UI.flat?'none':'visible');}$('#z3d').setAttribute('aria-pressed',String(!UI.flat));$('#z3d').textContent=UI.flat?'2D':'3D';});
  setInterval(()=>{const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());document.querySelectorAll('.card .tm[data-t],#alertTm').forEach(el=>{el.textContent=ago(+el.dataset.t);});if(UI.tab==='mando')counters();},1000);
}
async function boot(){
  wire();const hash=(location.hash||'').slice(1);
  let db=null;try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
  if(db){api=dbApi(db);S.mode='db';setConn('db','En vivo');}else{api=localApi();S.mode='local';setConn('local','Local');}
  let c=await api.get('config/main').catch(()=>null);const firstRun=!c;
  if(!c){const ok=await api.lease('meta/seed',20000);if(ok){c=await api.get('config/main').catch(()=>null);if(!c){c=defaultConfig();await seedAll(c);}}else{await new Promise(r=>setTimeout(r,3500));c=await api.get('config/main').catch(()=>null)||defaultConfig();}}
  S.config=c;M=c.mpu||80;
  api.watch('config',docs=>{const d=docs.find(x=>x.id==='main');if(d){const secChanged=JSON.stringify(d.data.sectores)!==JSON.stringify(S.config&&S.config.sectores);const geoChanged=JSON.stringify(d.data.geo||null)!==JSON.stringify(S.config&&S.config.geo||null);if(geoChanged)setTimeout(()=>flyHome(),50);S.config=d.data;M=d.data.mpu||80;maybePreset();MODEL=null;if(secChanged){staticKey='';if(CITY)CITY.bld.forEach(b=>{b.sid=null;});}render();}});
  let firstEv=true;const known=new Set();
  api.watch('eventos',docs=>{S.eventos=new Map(docs.map(x=>[x.id,x.data]));for(const d of docs){if(!known.has(d.id)){known.add(d.id);const ev=d.data;if(!firstEv&&(ev.sos||ev.cid==='apoyo')&&abierto(ev)&&Date.now()-ev.creado<30000)triggerAlert(ev);if(!firstEv&&abierto(ev)&&Date.now()-ev.creado<30000){const vg=vigOf(ev);if(vg)toast('Nuevo reporte en '+vg.nombre+': '+ev.cat);}}}firstEv=false;render();});
  api.watch('unidades',docs=>{S.unidades=new Map(docs.map(x=>[x.id,x.data]));render();});
  api.watch('historial',docs=>{const d=docs.find(x=>x.id==='main');S.historial=d?d.data:null;MODEL=null;render();});
  api.watch('contactos',docs=>{S.contactos=new Map(docs.map(x=>[x.id,x.data]));});
  api.watch('vigiladas',docs=>{S.vigiladas=new Map(docs.map(x=>[x.id,x.data]));syncZones();if(ZONE.vig)renderZone();});
  api.watch('presets',docs=>{S.presets=new Map(docs.map(x=>[x.id,x.data]));maybePreset();});
  if(S.mode==='local'&&window.__MS_PRESET){S.presets=new Map([['puebla',window.__MS_PRESET]]);await maybePreset();}
  renderLayers();if(!chat.length)menu(true);else renderChat();
  setTab(['pron','anal','unid','conf'].includes(hash)?hash:'mando');
  initMap();requestAnimationFrame(tick);
  if(firstRun&&S.mode==='local'){try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&polygon_threshold=0.0003&countrycodes=mx&limit=3&accept-language=es&q='+encodeURIComponent('Puebla, Puebla'));const js=await r.json();const p=js.find(x=>x.geojson&&/Polygon/.test(x.geojson.type));if(p)await buildFromPlace(p);}catch(e){}}
  await leaseLoop();setInterval(leaseLoop,5000);setInterval(demoTick,2500);
  render();
}
boot();
})();
